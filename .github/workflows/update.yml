name: Aktualizace akcí a nasazení

on:
  schedule:
    # UTC: 5:15, 11:15, 17:15 (v zimě 6:15, 12:15, 18:15 pražského času)
    - cron: '15 5,11,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Stažení akcí ze zdrojů
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/collect.mjs

      - name: Uložení dat do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add public/data cache
          if ! git diff --cached --quiet -- public/data/events.json cache; then
            git commit -m "Aktualizace akcí $(date -u +%Y-%m-%dT%H:%MZ)"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            # GitHub vypíná plánované workflow po 60 dnech bez aktivity
            git commit --allow-empty -m "Udržovací commit"
          else
            git reset -q
            echo "Akce se nezměnily."
          fi
          git pull --rebase --autostash && git push || true

      - name: Verze souborů (cache)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" public/*.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
